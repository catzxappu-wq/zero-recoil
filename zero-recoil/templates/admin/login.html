<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN LOGIN — ZERO RECOIL | ARMUGA X CATZX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="bg-[#050505] text-white flex items-center justify-center min-h-screen px-4 font-body selection:bg-[#B00000] selection:text-white">
  
  <div class="max-w-md w-full glass-card rounded-lg p-8 border-2 border-[#FF1A1A] shadow-[0_0_40px_rgba(255,26,26,0.3)]">
    
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-full bg-[#120505] border-2 border-[#FF1A1A] mx-auto flex items-center justify-center text-2xl text-[#FF1A1A] mb-3 shadow-[0_0_20px_rgba(255,26,26,0.5)]">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h1 class="font-heading font-black text-2xl text-white tracking-widest">
        ZERO <span class="text-[#FF1A1A]">RECOIL</span>
      </h1>
      <div class="font-esports font-bold text-gray-400 tracking-wider text-xs">
        ARMUGA X CATZX — ADMINISTRATOR ACCESS
      </div>
    </div>

    <!-- Flash message -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="mb-4 p-3 rounded text-xs font-esports font-bold {% if category == 'danger' or category == 'error' %}bg-red-950 text-red-200 border border-red-700{% else %}bg-zinc-800 text-white{% endif %}">
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('admin_login') }}" method="POST" class="space-y-4 text-xs font-esports">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

      <div>
        <label class="block text-gray-300 font-bold mb-1 tracking-wider">ADMIN EMAIL</label>
        <div class="relative">
          <i class="fa-solid fa-user-shield absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="email" name="email" required placeholder=" admin email" 
                 class="w-full bg-[#050505] border border-[#1E1E1E] focus:border-[#FF1A1A] rounded py-2.5 pl-9 pr-3 text-white font-body">
        </div>
      </div>

      <div>
        <label class="block text-gray-300 font-bold mb-1 tracking-wider">PASSWORD</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="password" name="password" required placeholder="••••••••" 
                 class="w-full bg-[#050505] border border-[#1E1E1E] focus:border-[#FF1A1A] rounded py-2.5 pl-9 pr-3 text-white font-body">
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full btn-esports-red py-3 text-sm tracking-wider font-bold shadow-[0_0_20px_rgba(255,26,26,0.6)]">
          <i class="fa-solid fa-right-to-bracket mr-2"></i> AUTHENTICATE AS ADMIN
        </button>
      </div>

      <!-- Seeded Admin Helper Note -->
      <div class="p-3 bg-[#0B0B0B] border border-[#1E1E1E] rounded text-[11px] text-gray-400 font-body space-y-1 mt-4">
        <div class="text-[#FF1A1A] font-esports font-bold tracking-wide">DEFAULT ADMIN CREDENTIALS:</div>
        
      </div>
    </form>

    <div class="mt-6 pt-4 border-t border-[#1E1E1E] text-center text-xs font-esports">
      <a href="{{ url_for('index') }}" class="text-gray-500 hover:text-white">
        ← BACK TO PUBLIC SITE
      </a>
    </div>

  </div>

</body>
</html>
