{% extends "base.html" %}

{% block title %}RESET PASSWORD — ZERO RECOIL | ARMUGA X CATZX{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 py-12">
  <div class="max-w-md w-full glass-card rounded-lg p-6 sm:p-8 border border-[#B00000]/50 shadow-[0_0_30px_rgba(255,26,26,0.2)]">
    
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded bg-[#120505] border border-[#FF1A1A] mx-auto flex items-center justify-center text-xl text-[#FF1A1A] mb-3">
        <i class="fa-solid fa-key"></i>
      </div>
      <h2 class="font-heading font-black text-2xl text-white tracking-wider">
        RESET <span class="text-[#FF1A1A]">PASSWORD</span>
      </h2>
      <p class="text-xs text-gray-400 font-esports tracking-wider mt-1">
        ENTER YOUR EMAIL TO RECEIVE PASSWORD RECOVERY INSTRUCTIONS
      </p>
    </div>

    <form action="{{ url_for('forgot_password') }}" method="POST" class="space-y-4 text-xs font-esports">
      <div>
        <label class="block text-gray-300 font-bold mb-1">REGISTERED EMAIL</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="email" name="email" required placeholder="player@gmail.com" 
                 class="w-full bg-[#050505] border border-[#1E1E1E] focus:border-[#FF1A1A] rounded py-2.5 pl-9 pr-3 text-white font-body">
        </div>
      </div>

      <button type="submit" class="w-full btn-esports-red py-3 text-sm tracking-wider">
        SEND RESET LINK
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-[#1E1E1E] text-center text-xs font-esports">
      <a href="{{ url_for('login') }}" class="text-gray-400 hover:text-white">
        ← BACK TO LOGIN
      </a>
    </div>

  </div>
</div>
{% endblock %}
